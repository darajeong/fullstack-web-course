<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query 실습</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>회원 목록</h1>
        <p>브라우저 너비를 줄였다 늘려보세요.</p>

        <p class="screen-status">
            현재 적용된 배치:
            <span class="wide-label">2열 — 768px 초과</span>
            <span class="narrow-label">1열 — 768px 이하</span>
        </p>

        <div class="member-grid">
            <article class="member-card">
                <h2>회원 1</h2>
                <p>홍길동</p>
            </article>

            <article class="member-card">
                <h2>회원 2</h2>
                <p>김영희</p>
            </article>

            <article class="member-card">
                <h2>회원 3</h2>
                <p>이철수</p>
            </article>

            <article class="member-card">
                <h2>회원 4</h2>
                <p>박민수</p>
            </article>
        </div>
    </main>
</body>
</html>
