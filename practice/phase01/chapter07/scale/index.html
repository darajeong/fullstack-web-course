<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상대 단위 실습</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>CSS 크기 단위 비교</h1>
        <p>브라우저 창의 너비와 높이를 바꿔보세요.</p>

        <div class="box fixed">너비: 200px</div>
        <div class="box percent">너비: 부모의 50%</div>
        <div class="box root">너비: 10rem</div>
        <div class="box viewport-width">너비: 화면의 50vw</div>
        <div class="box viewport-height">높이: 화면의 20vh</div>
    </main>
</body>
</html>
