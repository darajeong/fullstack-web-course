<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Explorer</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>Book Explorer</h1>
  </header>

  <main>
    <section aria-labelledby="search-heading">
      <h2 id="search-heading">도서 검색</h2>

      <form id="search-form">
        <label for="search-input">검색어</label>
        <input
          type="search"
          id="search-input"
          name="keyword"
          required
        >
        <button type="submit">검색</button>
      </form>

      <p id="status-message" role="status">검색어를 입력하세요.</p>
    </section>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading">검색 결과 목록</h2>
      <div id="book-list"></div>
    </section>

    <section aria-labelledby="detail-heading">
      <h2 id="detail-heading">도서 상세</h2>
      <div id="book-detail">도서를 선택하세요.</div>
    </section>

    <section aria-labelledby="register-heading">
      <h2 id="register-heading">도서 등록 요청</h2>

      <form id="book-form">
        <div>
          <label for="book-title">제목</label>
          <input type="text" id="book-title" name="title" required>
        </div>

        <div>
          <label for="book-author">저자</label>
          <input type="text" id="book-author" name="author" required>
        </div>

        <button type="submit">등록 요청</button>
      </form>

      <p id="form-message" role="status"></p>
    </section>
  </main>
</body>
</html>
