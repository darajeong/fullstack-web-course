<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 09 - 함수, 배열, 객체 실습</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>회원 데이터 관리 실습</h1>

        <div class="input-group">
            <input
                id="age"
                type="text"
                inputmode="numeric"
                placeholder="나이를 입력하세요"
                aria-label="나이"
            >
            <input
                id="name"
                type="text"
                placeholder="이름을 입력하세요"
                aria-label="이름"
            >
            <input type="button" id="btn" value="확인">
        </div>

        <!-- 함수 실습 영역 -->
        <div id="greeting-box"></div>

        <!-- map() 실습 영역 -->
        <h2>전체 회원 목록 (map)</h2>
        <ul id="user-list"></ul>

        <!-- filter() 실습 영역 -->
        <h2>활동 중인 회원 (filter)</h2>
        <ul id="active-user-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
